features:
  - name: Institutional Google onboarding
    description: Exact widyakarya.ac.id Google accounts self-register as least-privileged mahasiswa or link to an existing account
    files:
      - app/Http/Controllers/Auth/GoogleController.php
      - resources/views/auth/login.blade.php
    entry_route: /login
    user_interactions:
      - Click Masuk dengan Google
      - Select institutional Google account
      - Return to role dashboard
      - See rejection for empty or foreign-domain email
    api_calls:
      - method: GET
        endpoint: /auth/google
      - method: GET
        endpoint: /auth/google/callback
    auth_required: false
  - name: Role-based access
    description: Mahasiswa, dosen, and kaprodi receive isolated workspaces and permissions
    files:
      - app/Http/Middleware/RoleMiddleware.php
      - routes/web/mahasiswa.php
      - routes/web/dosen.php
      - routes/web/kaprodi.php
    entry_route: /
    user_interactions:
      - Sign in as each role
      - Navigate role sidebar
      - Attempt direct access to another role workspace
    api_calls: []
    auth_required: true
  - name: Student thesis lifecycle
    description: Students create, edit, publish, upload versions, review guidance, view grades, and submit final documents
    files:
      - app/Http/Controllers/Mahasiswa/SkripsiController.php
      - app/Http/Controllers/Mahasiswa/DocumentVersionController.php
      - app/Http/Controllers/Mahasiswa/BimbinganController.php
      - app/Http/Controllers/Mahasiswa/FinalSubmissionController.php
    entry_route: /mahasiswa/skripsi
    user_interactions:
      - Create or edit thesis
      - Upload proposal and revision documents
      - Review guidance history
      - Submit final documents when eligible
      - View published grades
    api_calls:
      - method: POST
        endpoint: /mahasiswa/skripsi
      - method: POST
        endpoint: /mahasiswa/skripsi/{skripsi}/documents
      - method: POST
        endpoint: /mahasiswa/skripsi/{skripsi}/final-submission/{event}
    auth_required: true
  - name: Lecturer guidance and grading
    description: Assigned lecturers review thesis work, record guidance, grade events, and request defense
    files:
      - app/Http/Controllers/Dosen/SkripsiViewController.php
      - app/Http/Controllers/Dosen/BimbinganController.php
      - app/Http/Controllers/Dosen/PenilaianController.php
    entry_route: /dosen/skripsi
    user_interactions:
      - Open assigned thesis
      - Record or update guidance
      - Enter component grades
      - Publish and lock grading
      - Request grade unlock
    api_calls:
      - method: POST
        endpoint: /dosen/skripsi/{skripsi}/bimbingan
      - method: POST
        endpoint: /dosen/penilaian/{skripsi}
    auth_required: true
  - name: Kaprodi oversight and decisions
    description: Kaprodi manages users, periods, formats, assignments, schedules, approvals, and final review
    files:
      - app/Http/Controllers/Kaprodi/SkripsiController.php
      - app/Http/Controllers/Kaprodi/DosenController.php
      - app/Http/Controllers/Kaprodi/ProposalSubmissionController.php
      - app/Http/Controllers/Kaprodi/SidangRequestController.php
      - app/Http/Controllers/Kaprodi/FinalReviewController.php
    entry_route: /kaprodi/dashboard
    user_interactions:
      - Manage lecturer and student records
      - Import institutional users
      - Assign reviewers
      - Schedule proposal and thesis defenses
      - Approve or reject workflow requests
      - Review final documents
    api_calls:
      - method: POST
        endpoint: /kaprodi/skripsi/{skripsi}/reviewers
      - method: POST
        endpoint: /kaprodi/skripsi/{skripsi}/proposal/approve
      - method: POST
        endpoint: /kaprodi/skripsi/{skripsi}/final-review/approve
    auth_required: true
  - name: Public thesis library
    description: Visitors browse completed thesis records without authentication
    files:
      - app/Http/Controllers/LibraryController.php
      - resources/views/library/index.blade.php
      - resources/views/library/show.blade.php
    entry_route: /library
    user_interactions:
      - Browse completed theses
      - Search or filter records
      - Open thesis detail
    api_calls: []
    auth_required: false
known_limitations:
  - issue: TestSprite cannot complete real Google OAuth without an interactive institutional Google account and provider session
    location: /auth/google
    impact: Automated role tests require seeded password test accounts or a pre-authenticated browser session
  - issue: Production Vite build warns that /images/login-wave.jpg is unresolved at build time
    location: resources/css/app.css
    impact: Login background depends on runtime public image availability
